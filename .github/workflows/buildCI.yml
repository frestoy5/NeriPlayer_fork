name: Build nerplayerReleases APK

on:
  push:
    branches:
      - master
      - kugou
      - musicislandshare
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 修改点：添加 -PallowUnsignedRelease=true 参数
      - name: Build Release APK
        run: ./gradlew assembleRelease -PallowUnsignedRelease=true --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeriPlayer-${{ github.ref_name }}-release-apk
          path: app/build/outputs/apk/release/*.apk
